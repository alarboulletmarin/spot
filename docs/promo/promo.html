<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spot — promo</title>
<!--
  15-second promo for spot. Every frame is a pure function of time: render(t).
  Open in a browser to preview (it plays in real time), or run render.mjs to export.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c18; }
  body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #0b0c18; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 47%; }
  .abs { position: absolute; left: 0; top: 0; }
  .mono { font-family: "DejaVu Sans Mono", monospace; }
  .disp { font-family: "Inter Display", "Inter", sans-serif; }

  #bg { position: absolute; inset: 0; background: linear-gradient(118deg, #1d1f45 0%, #3d3a78 38%, #7a4f93 70%, #c47a9f 100%); }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .55; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(5,5,20,.55) 100%); }
  #grain { position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }

  .key { position: absolute; height: 92px; padding: 0 30px; border-radius: 18px;
         display: flex; align-items: center; justify-content: center;
         font: 600 30px "Inter", sans-serif; color: #f6f5f4; letter-spacing: .01em;
         background: linear-gradient(180deg, #34355a, #24254a);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 10px 0 #15162e, 0 18px 40px rgba(0,0,0,.5); }
  .key.small { height: 54px; padding: 0 20px; border-radius: 12px; font-size: 20px;
               box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 0 #15162e, 0 12px 26px rgba(0,0,0,.4); }

  #card { position: absolute; overflow: hidden; }
  #entry { position: absolute; left: 0; top: 0; height: 92px; right: 0; display: flex; align-items: center; padding-left: 92px;
           font-size: 30px; white-space: pre; }
  #caret { display: inline-block; width: 2.5px; height: 36px; margin-left: 2px; border-radius: 2px; }
  #divider { position: absolute; left: 0; right: 0; height: 1px; }
  #sel { position: absolute; }
  .row { position: absolute; display: flex; align-items: center; }
  .row .ic { width: 44px; height: 44px; margin-left: 20px; flex: none; }
  .row .tx { margin-left: 20px; flex: 1; min-width: 0; }
  .row .ti { font-size: 21px; font-weight: 500; line-height: 1.25; white-space: nowrap; }
  .row .su { font-size: 15px; line-height: 1.3; opacity: .68; white-space: nowrap; }
  .row .kd { margin-right: 20px; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
  #footer { position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 22px; padding: 0 26px; font-size: 14px; }
  #footer b { font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-right: 6px; font-size: 13px; }

  #glyph { position: absolute; left: 0; top: 0; width: 128px; height: 128px; transform-origin: 0 0; overflow: visible; }

  .callout { position: absolute; color: #fff; }
  .callout .ln { position: absolute; height: 2px; background: rgba(255,255,255,.7); transform-origin: 0 50%; }
  .callout .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; margin: -4px 0 0 -5px; }
  .m { overflow: hidden; display: block; }
  .m > span { display: inline-block; }

  .hud { position: absolute; font: 500 14px "DejaVu Sans Mono", monospace; letter-spacing: .22em; color: rgba(255,255,255,.62); text-transform: uppercase; }

  .panel { position: absolute; inset: 0; }
  .word { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
          font: 800 280px "Inter Display", sans-serif; letter-spacing: -.045em; }
  .lt { display: inline-block; }
  .wm { overflow: hidden; display: inline-block; padding: 0 .02em; line-height: 1.1; }
  .tag { position: absolute; font: 500 16px "DejaVu Sans Mono", monospace; letter-spacing: .2em; text-transform: uppercase; }

  .marq { position: absolute; left: 0; white-space: nowrap; font: 800 170px "Inter Display", sans-serif; letter-spacing: -.03em;
          color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.16); }
  .vline { position: absolute; left: 180px; font: 800 118px "Inter Display", sans-serif; letter-spacing: -.035em; color: #fff; line-height: 1.08; }

  #endIcon { position: absolute; width: 176px; height: 176px; }
  #wordmark { position: absolute; font: 800 230px "Inter Display", sans-serif; letter-spacing: -.05em; color: #fff; line-height: 1; white-space: nowrap; }
  #tagline { position: absolute; left: 0; right: 0; text-align: center; font: 500 40px "Inter", sans-serif; color: rgba(255,255,255,.92); perspective: 600px; }
  #tagline div { position: absolute; left: 0; right: 0; backface-visibility: hidden; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="bgwrap" class="abs" style="inset:0">
      <div id="bg"></div>
      <div class="blob" id="b1"></div>
      <div class="blob" id="b2"></div>
      <div class="blob" id="b3"></div>
      <div id="vignette"></div>
    </div>
    <div id="layer"></div>
  </div>
  <div id="over"></div>
  <div id="grain"></div>
</div>

<script>
/* ---------- format: 16:9 by default, 9:16 with #vertical ---------- */
const V = /vertical/.test(location.hash + location.search);
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, MX = W / 2, MY = H / 2;
for (const e of [document.documentElement, document.body]) { e.style.width = W + 'px'; e.style.height = H + 'px'; }
if (V) document.head.insertAdjacentHTML('beforeend', '<style>.word { font-size: 210px !important; } .vline { left: 80px !important; }</style>');

/* ---------- maths ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out3: k => 1 - Math.pow(1 - k, 3),
  in3: k => k * k * k,
  io3: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  inExpo: k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10),
  ioExpo: k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outBack: k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  inBack: k => { const c1 = 1.70158; return (c1 + 1) * k * k * k - c1 * k * k; },
  spring: k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.exp(-6.5 * k) * Math.cos(k * Math.PI * 3.4),
};
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mixc = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a ?? (c[3] ?? 1)})`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const punch = (t, a, amp = .03, d = 9) => t < a ? 0 : amp * Math.exp(-(t - a) * d) * Math.cos((t - a) * 18);

/* ---------- dom helpers ---------- */
const layer = document.getElementById('layer'), over = document.getElementById('over');
function mk(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || layer).appendChild(e); return e; }
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, v) => { e.style.display = v ? '' : 'none'; };

/* ---------- brand data ---------- */
const PAL = {
  adw:           { bg: '#fafafb', fg: '#2e3436', ac: '#3584e4', acfg: '#ffffff' },
  catppuccin:    { bg: '#1e1e2e', fg: '#cdd6f4', ac: '#cba6f7', acfg: '#1e1e2e' },
  nord:          { bg: '#2e3440', fg: '#eceff4', ac: '#88c0d0', acfg: '#2e3440' },
  dracula:       { bg: '#282a36', fg: '#f8f8f2', ac: '#bd93f9', acfg: '#282a36' },
  gruvbox:       { bg: '#282828', fg: '#ebdbb2', ac: '#fe8019', acfg: '#282828' },
  'tokyo-night': { bg: '#1a1b26', fg: '#c0caf5', ac: '#7aa2f7', acfg: '#1a1b26' },
  'rose-pine':   { bg: '#191724', fg: '#e0def4', ac: '#ebbcba', acfg: '#191724' },
};
const STY = {
  default: { r: 22, a: 1,   rowR: 12, rowH: 68, pad: 12, sel: 0 },
  glass:   { r: 34, a: .5,  rowR: 14, rowH: 68, pad: 12, sel: 1, border: 1 },
  compact: { r: 16, a: 1,   rowR: 8,  rowH: 56, pad: 10, sel: 2 },
  flat:    { r: 0,  a: 1,   rowR: 0,  rowH: 68, pad: 0,  sel: 0 },
  rounded: { r: 58, a: 1,   rowR: 34, rowH: 68, pad: 16, sel: 0 },
  mono:    { r: 4,  a: 1,   rowR: 0,  rowH: 62, pad: 12, sel: 3, mono: 1 },
};
const STYDESC = { default: 'Solid card, the selection in the accent colour', glass: 'Translucent card, a soft tint of the accent', compact: 'Denser rows, a neutral tint', flat: 'Square corners, rows from edge to edge', rounded: 'A pill for a card and pills for rows', mono: 'Fixed-width type, selection in reverse video' };
const PALS = ['catppuccin', 'nord', 'dracula', 'gruvbox', 'tokyo-night', 'rose-pine'];
const STYS = ['default', 'glass', 'compact', 'flat', 'rounded', 'mono'];
const MARQUEE = ['apps', 'files', 'commands', 'web search', 'palettes', 'styles', 'system actions', 'alarboulletmarin/spot'];

function look(sn, pn) {
  const s = STY[sn], p = PAL[pn];
  const bg = hex(p.bg), fg = hex(p.fg), ac = hex(p.ac), acfg = hex(p.acfg);
  let selBg, selFg;
  if (s.sel === 0) { selBg = [...ac, 1]; selFg = acfg; }
  else if (s.sel === 1) { selBg = [...ac, .3]; selFg = fg; }
  else if (s.sel === 2) { selBg = [...fg, .1]; selFg = fg; }
  else { selBg = [...fg, 1]; selFg = bg; }
  return { r: s.r, a: s.a, rowR: s.rowR, rowH: s.rowH, pad: s.pad, mono: s.mono || 0, border: s.border || 0, bg, fg, ac, selBg, selFg };
}
const mixLook = (A, B, k) => { const o = {}; for (const key in A) o[key] = Array.isArray(A[key]) ? mixc(A[key], B[key], k) : lerp(A[key], B[key], k); return o; };
const LK = [[0, 'default', 'adw']];
PALS.forEach((p, i) => LK.push([5.75 + i * .27, 'default', p]));
STYS.forEach((s, i) => LK.push([7.5 + i * .22, s, 'rose-pine']));
LK.push([8.85, 'default', 'adw']);
function lookAt(t) {
  let i = 0; while (i + 1 < LK.length && LK[i + 1][0] <= t) i++;
  const L = look(LK[i][1], LK[i][2]); if (i === 0) return L;
  return mixLook(look(LK[i - 1][1], LK[i - 1][2]), L, E.out3(P(t, LK[i][0], LK[i][0] + .22)));
}

/* ---------- icons ---------- */
const page = (fill, stroke, extra = '') => `<path d="M10 3h17l9 9v29H10z" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/><path d="M27 3v9h9" fill="${stroke}" opacity=".5"/>${extra}`;
function iconSVG(kind) {
  let b = '';
  if (kind === 'calc') {
    b = `<rect x="8" y="3" width="28" height="38" rx="5" fill="#d5d3cf"/><rect x="12" y="7" width="20" height="9" rx="2" fill="#2ec27e"/>`;
    [15, 22, 29].forEach(x => [23, 29.5, 36].forEach(y => b += `<circle cx="${x}" cy="${y}" r="2.6" fill="${x === 29 && y === 36 ? '#e66100' : '#5e5c64'}"/>`));
  } else if (kind === 'folder') b = `<path d="M4 11a3 3 0 0 1 3-3h10l4 4h16a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#438de6"/><path d="M4 17h36v17a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#99c1f1"/>`;
  else if (kind === 'file') b = page('#fafafa', '#c0bfbc', [18, 23, 28, 33].map(y => `<rect x="15" y="${y}" width="16" height="2" rx="1" fill="#c0bfbc"/>`).join(''));
  else if (kind === 'zip') b = page('#e9dcc2', '#b5a27f', `<rect x="21" y="16" width="4" height="12" fill="#77674a"/><rect x="20" y="27" width="6" height="6" rx="1.5" fill="#77674a"/>`);
  else if (kind === 'sheet') b = page('#fafafa', '#c0bfbc', `<rect x="15" y="27" width="4" height="8" fill="#2ec27e"/><rect x="21" y="22" width="4" height="13" fill="#3584e4"/><rect x="27" y="25" width="4" height="10" fill="#e66100"/>`);
  else if (kind === 'term') b = `<rect x="3" y="6" width="38" height="32" rx="7" fill="#241f31"/><path d="M11 16l6 5.5-6 5.5" stroke="#8ff0a4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 29h11" stroke="#8ff0a4" stroke-width="3" stroke-linecap="round"/>`;
  else if (kind === 'web') b = `<circle cx="22" cy="22" r="17" fill="#3584e4"/><g stroke="#fff" stroke-width="2" fill="none" opacity=".9"><ellipse cx="22" cy="22" rx="7" ry="17"/><path d="M5 22h34M8 13h28M8 31h28"/></g>`;
  else if (kind.startsWith('pal:')) {
    const p = PAL[kind.slice(4)];
    b = `<circle cx="22" cy="22" r="17" fill="${p.bg}" stroke="${p.fg}" stroke-opacity=".35" stroke-width="2"/><path d="M22 5a17 17 0 0 1 0 34z" fill="${p.ac}"/><circle cx="15" cy="22" r="4" fill="${p.fg}"/>`;
  } else if (kind.startsWith('sty:')) {
    const s = STY[kind.slice(4)], r = Math.min(13, s.r / 3.5);
    b = `<rect x="4" y="8" width="36" height="28" rx="${r}" fill="#9a9996" opacity="${s.a < 1 ? .5 : .9}"/><rect x="${s.pad ? 8 : 4}" y="18" width="${s.pad ? 28 : 36}" height="8" rx="${Math.min(4, s.rowR / 3)}" fill="${s.sel === 3 ? '#241f31' : s.sel === 2 ? '#deddda' : '#3584e4'}"/>`;
  }
  return `<svg viewBox="0 0 44 44" width="44" height="44">${b}</svg>`;
}

/* ---------- scenes of the launcher ---------- */
const ROWS = {
  none: [],
  calc: [['calc', 'Calculator', 'Perform arithmetic, scientific or financial calculations', 'Application'],
         ['folder', 'Calculus', '~/Documents/Calculus', 'Folder'],
         ['file', 'calculate.rs', '~/projects/spot/calculate.rs', 'File'],
         ['zip', 'calculator-icons.zip', '~/Downloads/calculator-icons.zip', 'File'],
         ['file', 'tax-calculation.txt', '~/Documents/tax-calculation.txt', 'File'],
         ['sheet', 'budget-calculator.ods', '~/Documents/budget-calculator.ods', 'File']],
  htop: [['term', 'htop', 'Runs in your terminal, which stays open afterwards', 'Terminal']],
  web: [['web', 'Search for “rust gtk4”', 'Your default browser, with its own search engine', 'Web']],
  pal: PALS.map(n => ['pal:' + n, 'Palette: ' + n, 'Moving here previews it. Enter writes it to spot.conf', 'Setting']),
  sty: STYS.map(n => ['sty:' + n, 'Style: ' + n, STYDESC[n], 'Setting']),
};
const FOOT = {
  none: '', calc: '<span><b>Enter</b>Launch</span><span><b>Ctrl+Enter</b>Show in folder</span><span><b>Alt+1…9</b>Pick by number</span>',
  htop: '<span><b>Enter</b>Run in a terminal</span><span><b>Ctrl+Enter</b>Run, then close it</span>',
  web: '<span><b>Enter</b>Search in your browser</span>',
  pal: '<span><b>Enter</b>Save to spot.conf</span><span><b>Esc</b>Put things back</span>',
  sty: '<span><b>Enter</b>Save to spot.conf</span><span><b>Esc</b>Put things back</span>',
};
const SC = [
  { t0: -9, q: '', rows: 'none' },
  { t0: 2.55, q: 'calc', cps: .085, rows: 'calc', rowsAt: 2.78 },
  { t0: 4.4, q: '!htop', cps: .045, rows: 'htop' },
  { t0: 5.0, q: 'search: rust gtk4', cps: .02, rows: 'web' },
  { t0: 5.6, q: '>palette', cps: .02, rows: 'pal', sel: t => stepper(t, 5.75, .27, 6) },
  { t0: 7.4, q: '>style', cps: .02, rows: 'sty', sel: t => stepper(t, 7.5, .22, 6) },
  { t0: 8.85, q: 'calc', cps: 0, rows: 'calc', rowsAt: 8.86 },
];
function stepper(t, s, step, n) {
  if (t < s) return 0;
  const i = Math.min(n - 1, Math.floor((t - s) / step));
  if (i === 0) return 0;
  return i - 1 + E.outBack(clamp((t - (s + i * step)) / .17));
}
const sceneIdx = t => { let i = 0; while (i + 1 < SC.length && SC[i + 1].t0 <= t) i++; return i; };

/* ---------- build: background ---------- */
const blobs = ['b1', 'b2', 'b3'].map(id => document.getElementById(id));
const bgwrap = document.getElementById('bgwrap');
const grain = document.getElementById('grain');
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const r = rng(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); grain.style.backgroundImage = `url(${c.toDataURL()})`; })();

/* ---------- build: intro keys + shockwave ---------- */
const kSuper = mk('div', 'key', layer, 'Super'), kPlus = mk('div', 'abs disp', layer, '+'), kSpace = mk('div', 'key', layer, 'Space');
st(kSpace, { width: '300px' }); st(kPlus, { font: '600 54px Inter', color: 'rgba(255,255,255,.5)' });
const ring = mk('div', 'abs', layer); st(ring, { borderRadius: '50%', border: '3px solid #8fb8f0' });
const ring2 = mk('div', 'abs', layer); st(ring2, { borderRadius: '50%', border: '2px solid rgba(255,255,255,.5)' });

/* ---------- build: launcher card ---------- */
const card = mk('div', '', layer); card.id = 'card';
const sel = mk('div', '', card); sel.id = 'sel';
const entry = mk('div', '', card); entry.id = 'entry';
const qt = mk('span', '', entry); const caret = mk('span', '', entry); caret.id = 'caret';
const divider = mk('div', '', card); divider.id = 'divider';
const rowEls = Array.from({ length: 6 }, () => { const r = mk('div', 'row', card); r.innerHTML = '<div class="ic"></div><div class="tx"><div class="ti"></div><div class="su"></div></div><div class="kd"></div>'; return r; });
const footer = mk('div', '', card); footer.id = 'footer';
const glyph = mk('div', '', layer); glyph.id = 'glyph';
glyph.innerHTML = `<svg width="128" height="128" viewBox="0 0 128 128" style="overflow:visible"><circle id="gc" cx="55" cy="55" r="25" fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 55 55)"/><path id="gp" d="M74 74 L96 96" stroke-width="11" stroke-linecap="round" fill="none"/></svg>`;
const gc = glyph.querySelector('#gc'), gp = glyph.querySelector('#gp');
const keyEsc = mk('div', 'key small', layer, 'Esc'), keyEnter = mk('div', 'key small', layer, 'Enter ⏎');
const burst = mk('div', 'abs', layer); const burstLines = Array.from({ length: 12 }, () => { const l = mk('div', 'abs', burst); st(l, { height: '3px', borderRadius: '3px', background: '#fff', transformOrigin: '0 50%' }); return l; });
const flash = mk('div', 'abs', layer); st(flash, { borderRadius: '50%', background: 'radial-gradient(circle, #fff 0%, rgba(160,200,255,.8) 35%, rgba(160,200,255,0) 70%)' });

/* ---------- build: callouts ---------- */
function callout(side, html) {
  const c = mk('div', 'callout', layer); const ln = mk('div', 'ln', c); const dot = mk('div', 'dot', c);
  const body = mk('div', '', c, html); st(body, { position: 'absolute', top: '0', width: '420px' });
  if (V) { side = 'T'; st(body, { left: '-450px', width: '900px', textAlign: 'center' }); }
  else if (side === 'L') st(body, { right: '0', textAlign: 'right' }); else st(body, { left: '0' });
  return { c, ln, dot, body, side, lines: [...body.querySelectorAll('.m > span')] };
}
const CA = callout('L', `<div class="m"><span class="disp" style="font:800 150px 'Inter Display';letter-spacing:-.05em;line-height:1"><span id="ms">10</span><span style="font-size:64px;letter-spacing:-.02em"> ms</span></span></div><div class="m"><span style="font:500 24px Inter;opacity:.85">to open the window</span></div><div class="m"><span class="mono" style="font-size:15px;opacity:.6;letter-spacing:.12em">MEDIAN · RESIDENT PROCESS</span></div>`);
const msEl = CA.body.querySelector('#ms');
const CB1 = callout('R', `<div class="m"><span class="mono" style="font:700 64px 'DejaVu Sans Mono'">!</span></div><div class="m"><span style="font:600 32px Inter">runs in your terminal</span></div><div class="m"><span style="font:400 20px Inter;opacity:.7">your shell, your aliases, your PATH</span></div>`);
const CB2 = callout('R', `<div class="m"><span class="mono" style="font:700 56px 'DejaVu Sans Mono'">search:</span></div><div class="m"><span style="font:600 32px Inter">your browser, its engine</span></div><div class="m"><span style="font:400 20px Inter;opacity:.7">spot never picks one for you</span></div>`);
const CC = callout('L', `<div class="m"><span class="disp" style="font:800 96px 'Inter Display';letter-spacing:-.04em;line-height:1.05">12</span></div><div class="m"><span style="font:600 34px Inter">palettes, light and dark</span></div><div class="m"><span class="mono" id="palname" style="font:500 22px 'DejaVu Sans Mono';letter-spacing:.06em">catppuccin</span></div><div class="m"><span style="font:400 20px Inter;opacity:.7">previewed as you move, nothing saved</span></div>`);
const palName = CC.body.querySelector('#palname');

/* ======================================================================= */
function render(t) {
  const L = lookAt(t);
  const si = sceneIdx(t), S = SC[si], Sprev = SC[Math.max(0, si - 1)];

  /* camera: slow push, punches on key beats */

  const ac = L.ac;

    st(b, { left: `${MX + Math.cos(a) * (V ? 260 : 520) - 450 + (i - 1) * (V ? 160 : 300)}px`, top: `${MY + Math.sin(a * 1.3) * (V ? 650 : 300) - 450 + (i - 1) * (V ? 300 : 0)}px`, background: rgba(col, 1) });
  });

  /* ---- intro keys ---- */

    const pr = t >= .72 && t < .86 ? 8 : 0;
    const out = E.inBack(P(t, .86, 1.12));

    items.forEach(([e, x, w, d]) => {

      const sc = 1 - out;

    });

    st(r, { left: `${MX - rr}px`, top: `${MY - rr}px`, width: `${rr * 2}px`, height: `${rr * 2}px`, opacity: 1 - k });
  });

  /* ---- the card: icon → search bar → launcher → implode ---- */
  const cardOn = t > .85 && t < 9.56;
  show(card, cardOn); show(glyph, t > .85 && t < 9.25);
  if (cardOn) {
    // height follows the scene's row count
    const n = ROWS[S.rows].length, nP = ROWS[Sprev.rows].length;
    const hAt = S.rowsAt ?? S.t0;
    const hk = E.outExpo(P(t, hAt, hAt + .4));
    const Ht = lerp(cardH(nP, L), cardH(n, L), si === 0 ? 1 : hk);

    const iconS = E.outBack(P(t, .85, 1.2));

    const w = lerp(128 * iconS, CW, mk_), h = lerp(128 * iconS, Ht, mk_);
    const cy = lerp(MY, CTOP + h / 2, mk_);
    const r = lerp(28 * iconS, L.r, mk_);

    // implode

    const hot = P(t, 9.22, 9.36);

    card.style.fontFamily = L.mono > .5 ? "'DejaVu Sans Mono', monospace" : '';

    // glyph: from the icon's centre to the entry's search icon

    const gx = lerp(MX - 64 * iconS, CX - CW / 2 + 46 - 55 * .4, mk_), gy = lerp(MY - 64 * iconS, CTOP + 46 - 55 * .4, mk_);

    st(glyph, { transform: `translate(${gx}px,${gy}px) scale(${gs})`, opacity: 1 - P(t, 9.2, 9.25) });
    const dc = 157.08, dp = 31.2;
    gc.setAttribute('stroke', gcol); gp.setAttribute('stroke', gcol);

    gp.setAttribute('stroke-dasharray', dp); gp.setAttribute('stroke-dashoffset', dp * (1 - E.out3(P(t, 1.2, 1.4))));

    // query

    qt.textContent = S.q.slice(0, Math.max(0, typed));

    qt.style.transform = `translateY(${(1 - qin) * 14}px)`; qt.style.display = 'inline-block';
    st(qt, { color: rgba(L.fg, 1), fontSize: L.mono > .5 ? '27px' : '30px' });

    caret.style.background = rgba(L.ac, 1);
    caret.style.opacity = typing ? 1 : (Math.floor(t * 2.2) % 2 ? .15 : 1);

    // rows
    const key = S.rows; const data = ROWS[key];
    if (rowsKey !== key) { rowsKey = key; footer.innerHTML = FOOT[key];
      rowEls.forEach((el, i) => { const d = data[i]; if (!d) return; el.querySelector('.ic').innerHTML = iconSVG(d[0]); el.querySelector('.ti').textContent = d[1]; el.querySelector('.su').textContent = d[2]; el.querySelector('.kd').textContent = d[3]; }); }

    const selPos = S.sel ? S.sel(t) : 0;

      const o = E.out3(P(t, a, a + .28));

      st(el, { left: `${L.pad}px`, top: `${rowsTop + i * L.rowH}px`, width: `${rw}px`, height: `${L.rowH}px`, opacity: o, transform: `translateY(${(1 - o) * 18}px)`, color: rgba(col, 1) });
      const kd = el.children[2]; st(kd, { background: rgba(col, .13) });
      el.children[0].style.transform = `scale(${L.rowH < 60 ? .82 : 1})`;
    });
    const so = E.out3(P(t, appear0, appear0 + .25)) * (n > 0 ? 1 : 0);
    st(sel, { left: `${L.pad}px`, top: `${rowsTop + selPos * L.rowH}px`, width: `${rw}px`, height: `${L.rowH}px`, borderRadius: `${L.rowR}px`, background: rgba(L.selBg), opacity: so * inner });
    st(footer, { top: `${rowsTop + n * L.rowH + L.pad}px`, color: rgba(L.fg, .55), opacity: inner * (n ? hk : 0) });
    footer.querySelectorAll('b').forEach(b => st(b, { background: rgba(L.fg, .08), border: `1px solid ${rgba(L.fg, .16)}` }));
  }

  /* keycaps under the card: Esc, then Enter */
  const ky = CTOP + cardH(6, look('default', 'adw')) + 56;
  [[keyEsc, 8.62, 8.85, 9.05, 818 + MX - 960], [keyEnter, 8.95, 9.15, 9.4, 1010 + MX - 960]].forEach(([e, a, pr, b, x]) => {

    const k = E.outBack(P(t, a, a + .25)), o = E.inBack(P(t, b, b + .18));

  });

  /* implode flash + burst */

  if (fk > 0 && fk < 1) {
    const fr = 30 + E.outExpo(fk) * 260; st(flash, { left: `${MX - fr}px`, top: `${CTOP + 283 - fr}px`, width: `${fr * 2}px`, height: `${fr * 2}px`, opacity: 1 - E.in3(fk) });

  const sIdx = clamp(Math.floor((t - 7.5) / .22), 0, 5);
  styList.innerHTML = STYS.map((s, i) => i === sIdx ? `<span style="background:#fff;color:#191724;padding:0 5px">${s}</span>` : `<span style="opacity:.55;padding:0 5px">${s}</span>`).join(' ');
  placeCallout(CE, t, 8.88, 9.12, CX - CW / 2 - 24, cMid);

  const cs = Math.floor(t * 100); hud[2].textContent = `00:${String(Math.floor(t)).padStart(2, '0')}.${String(cs % 100).padStart(2, '0')}  /  00:15.00`;
